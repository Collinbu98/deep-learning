[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrad"
version = "0.1.0"
description = "A tiny autodiff and neural network framework built from scratch for learning"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
llm = ["transformers>=4.37"]
nli = ["transformers>=4.37"]
